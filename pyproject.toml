[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "korvoice"
version = "1.0.0"
description = "Push-to-talk / toggle Russian voice input for Linux, powered by the local GigaAM speech model — tray, Nord GUI, no cloud."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Ivan Cherniy" }]
keywords = ["speech-recognition", "asr", "gigaam", "voice-input", "dictation", "tray", "qt", "russian"]
classifiers = [
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "PySide6>=6.5",
    "PyYAML>=6.0",
    "numpy>=1.24",
    "sounddevice>=0.4",
    # GigaAM is deliberately installed in a documented second step. PyPI's
    # gigaam 0.1.0 lacks the v3/e2e models korvoice uses, while PyPI rejects
    # direct Git dependencies in uploaded metadata. See README "Install".
]

[project.optional-dependencies]
# No mypy: strict typechecking is optional for a small GUI utility like this
# one (kortalk, the project korvoice is patterned after, skips it too).
dev = ["pytest>=8.2,<9", "pytest-qt>=4", "ruff>=0.5,<1"]

# Presentation convention: keep all four public project contacts together
# everywhere links are shown (About, README, release/package metadata).
[project.urls]
Homepage = "https://r4ven.me"
Repository = "https://github.com/r4ven-me/korvoice"
Telegram = "https://t.me/r4ven_me"
Chat = "https://t.me/r4ven_me_chat"

[project.scripts]
korvoice = "korvoice.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
korvoice = ["icons/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
